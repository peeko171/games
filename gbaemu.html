<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Single-File GB / GBC / GBA Emulator</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      background-color: #18181b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      margin: 0 0 15px 0;
      font-size: 1.5rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      background: #27272a;
      padding: 12px;
      border-radius: 8px;
      align-items: center;
    }
    button, .file-btn {
      background-color: #7c3aed;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    button:hover, .file-btn:hover {
      background-color: #6d28d9;
    }
    button:disabled {
      background-color: #52525b;
      cursor: not-allowed;
    }
    input[type="file"] {
      display: none;
    }
    #screen-container {
      background-color: #000;
      border: 4px solid #3f3f46;
      border-radius: 6px;
      width: 480px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
    }
    #screen-container canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
    }
    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #34d399;
      min-height: 1.2em;
    }
    .controls-info {
      margin-top: 12px;
      color: #a1a1aa;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Web GB / GBC / GBA Emulator</h1>

  <div class="toolbar">
    <label class="file-btn">
      Load ROM (.gb / .gbc / .gba)
      <input type="file" id="romInput" accept=".gb,.gbc,.gba">
    </label>
    <button id="exportStateBtn" disabled>Export Save State</button>
    <label class="file-btn" id="importLabel" style="background-color: #52525b; pointer-events: none;">
      Import Save State
      <input type="file" id="stateInput" accept=".state">
    </label>
    <button id="exportSramBtn" disabled>Export Battery Save (.sav)</button>
  </div>

  <div id="screen-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Load a .gb, .gbc, or .gba ROM file to start.</div>

  <div class="controls-info">
    <strong>Default Controls:</strong><br>
    D-Pad: <b>Arrow Keys</b> | Start: <b>Enter</b> | Select: <b>Right Shift</b><br>
    A: <b>X</b> | B: <b>Z</b> | L Trigger: <b>A</b> | R Trigger: <b>S</b>
  </div>

  <script>
    let emulator = null;
    let currentRomName = "gameboy_game";

    const romInput = document.getElementById('romInput');
    const exportStateBtn = document.getElementById('exportStateBtn');
    const importLabel = document.getElementById('importLabel');
    const stateInput = document.getElementById('stateInput');
    const exportSramBtn = document.getElementById('exportSramBtn');

    // Load ROM
    romInput.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      if (!['gb', 'gbc', 'gba'].includes(ext)) {
        setStatus('Unsupported file. Please select a .gb, .gbc, or .gba file.', true);
        return;
      }

      currentRomName = file.name.replace(/\.(gb|gbc|gba)$/i, '');
      setStatus('Loading core & ROM (first run downloads WebAssembly core)...');

      try {
        if (emulator) {
          await emulator.exit({ removeCanvas: false });
          emulator = null;
        }

        // Launch using mGBA core (supports GB, GBC, and GBA)
        emulator = await Nostalgist.launch({
          core: 'mgba',
          rom: file,
          element: document.getElementById('canvas')
        });

        enableControls();
        setStatus(`Running: ${file.name}`);
      } catch (err) {
        setStatus(`Failed to launch ROM: ${err.message}`, true);
      }
      e.target.value = '';
    });

    // Export Save State (.state)
    exportStateBtn.addEventListener('click', async function() {
      if (!emulator) return;
      try {
        setStatus('Saving state...');
        const { state } = await emulator.saveState();
        downloadBlob(state, `${currentRomName}.state`);
        setStatus('Save state exported!');
      } catch (err) {
        setStatus(`Export failed: ${err.message}`, true);
      }
    });

    // Import Save State (.state)
    stateInput.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file || !emulator) return;

      try {
        await emulator.loadState(file);
        setStatus('Save state loaded!');
      } catch (err) {
        setStatus(`Failed to load save state: ${err.message}`, true);
      }
      e.target.value = '';
    });

    // Export In-Game Battery Save (.sav)
    exportSramBtn.addEventListener('click', async function() {
      if (!emulator) return;
      try {
        const { sram } = await emulator.saveSRAM();
        downloadBlob(sram, `${currentRomName}.sav`);
        setStatus('Battery save (.sav) exported!');
      } catch (err) {
        setStatus(`SRAM export failed: ${err.message}`, true);
      }
    });

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function enableControls() {
      exportStateBtn.disabled = false;
      exportSramBtn.disabled = false;
      importLabel.style.backgroundColor = '#7c3aed';
      importLabel.style.pointerEvents = 'auto';
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = isError ? '#f87171' : '#34d399';
    }
  </script>
</body>
</html>
